name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install phonosim
        run: pip install -e ".[dev]"
      - name: NLTK data for g2p_en
        run: python -c "import nltk; [nltk.download(p) for p in ('cmudict', 'averaged_perceptron_tagger_eng', 'averaged_perceptron_tagger')]"
      - name: Run tests
        run: pytest -q
