[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonosim"
version = "0.1.0"
description = "Researcher-facing phonetic similarity toolkit: Epitran → PanPhon → Hindi L1 cue-weighting → stimuli"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avni Kapoor" }]
dependencies = [
  "panphon>=0.22",
  "epitran>=1.25",
  "PyYAML>=6.0",
  "g2p-en>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["phonosim*"]

[tool.setuptools.package-data]
phonosim = ["data/*.yaml", "data/*.yml", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
